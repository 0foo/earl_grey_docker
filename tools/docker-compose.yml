services:
  tools:
    build:
      context: .
    image: bioinfo-tools:latest
    stdin_open: true
    tty: true

# Build:
#   docker compose build
#
# No fixed volumes — mount whatever host path(s) you're working with for
# this run, at the same path inside the container, with -v/--volume:
#   docker compose run --rm -v /data/bioinfo/data/genomes:/data/bioinfo/data/genomes \
#     tools seqkit seq -u /data/bioinfo/data/genomes/raw_data/<genome>.fna
#
# The tools/bin/ scripts do this automatically from the paths you pass them
# (see tools/README.md) — prefer those over calling compose directly.
