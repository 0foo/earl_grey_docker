services:
  earlgrey:
    build:
      context: .
    image: earlgrey-insects:latest
    stdin_open: true
    tty: true

# Build:
#   docker compose build
#
# No fixed volumes — mount whatever host paths you're working with for this
# run. Prefer bin/run-earlgrey (see README.md), which does this for you from
# plain host paths:
#   bin/run-earlgrey <genome-file> <dfam-dir> <output-dir> <species> [threads]
#
# Manually:
#   docker compose run --rm \
#     -v /data/bioinfo/data/dfam_data:/opt/conda/envs/earlgrey/share/famdb-3.0.0/Libraries/famdb \
#     -v /data/bioinfo/data/genomes:/data/bioinfo/data/genomes \
#     -v /data/bioinfo/data/output:/data/bioinfo/data/output \
#     earlgrey -g /data/bioinfo/data/genomes/raw_data/<genome>.fna -s <species> \
#       -o /data/bioinfo/data/output -t <threads>
#
# -g/-o also accept s3:// URIs (e.g. for the vps/ multi-machine setup) as
# long as AWS credentials are available in the container (mount ~/.aws or
# export AWS_*).
