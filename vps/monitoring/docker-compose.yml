services:
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    restart: unless-stopped
    # Host networking/PID namespace: needed for accurate host-level stats
    # (not just the container's own), and puts the web UI directly on the
    # host's network interfaces — including tailscale0, which is the point:
    # reachable at http://<tailscale-ip>:19999 from the tailnet, unreachable
    # from the public internet since the Robot firewall discards new
    # inbound connections that aren't Tailscale/established/ICMP/DNS (see
    # ../README.md).
    network_mode: host
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      # Read-only Docker socket access: lets Netdata's cgroups collector
      # show per-container CPU/mem too, e.g. the earlgrey container while
      # a job is running.
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
