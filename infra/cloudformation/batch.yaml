AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AWS Batch (EC2, Spot) setup for the earlgrey-insects image: ECR repo,
  IAM roles, a Spot compute environment across diversified instance types,
  a job queue, and a job definition. Dfam is cached per-host to a
  host-mounted volume the job definition wires up (see entrypoint.sh) rather
  than an EFS filesystem or COPY-ing it into the image, to avoid EFS
  storage/throughput cost and slow image builds.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DataBucketName:
    Type: String
    Description: >
      S3 bucket holding genomes, Dfam data, output, and batch manifests.
      The job role is scoped to this single bucket.
  ImageTag:
    Type: String
    Default: "7.3.1"
  MaxvCpus:
    Type: Number
    Default: 256
    Description: Cap on total concurrent vCPUs across all running jobs.
  JobVcpus:
    Type: Number
    Default: 10
    Description: >
      earlGrey's RepeatModeler/RepeatMasker stack runs ~10-12GB RAM per
      thread (sized here at 12GB/thread for headroom), so this must stay
      paired with JobMemoryMiB at roughly a 1:12 ratio — see JobMemoryMiB.
      Also passed to the container as THREADS by submit-batch, so -t
      matches what's actually reserved.
  JobMemoryMiB:
    Type: Number
    Default: 122880
    Description: >
      120GiB, i.e. 12GiB * JobVcpus(10). No standard EC2 family is natively
      12GiB/vCPU (memory-optimized r5/r5a/r6i/r6a run 8GiB/vCPU) — instead
      this under-requests vCPU relative to a 16vCPU/128GiB instance
      (4xlarge tier below) so the memory reservation alone forces one job
      per host on that size, while still fitting two jobs on the 8xlarge
      tier (32vCPU/256GiB has room for 2x 10vCPU/120GiB). If you change
      this, keep JobMemoryMiB <= (instance memory GiB - ~8GiB overhead) at
      whatever instance size you expect to pack one job onto.
  InstanceTypes:
    Type: CommaDelimitedList
    Default: "r5.4xlarge,r5.8xlarge,r5a.4xlarge,r5a.8xlarge,r6i.4xlarge,r6i.8xlarge,r6a.4xlarge,r6a.8xlarge"
    Description: >
      Memory-optimized only (8GiB/vCPU) — earlGrey needs ~10-12GB RAM/thread,
      which compute- or general-purpose families (2-4GiB/vCPU) can't cover
      without OOM-killing RepeatModeler/RepeatMasker. Diversified across
      families/sizes on purpose — improves Spot capacity availability and
      lets SPOT_CAPACITY_OPTIMIZED pick the least-likely-to-be-reclaimed
      pool instead of pinning to one instance type. All listed types are
      16vCPU/128GiB (4xlarge) or 32vCPU/256GiB (8xlarge), so JobVcpus/
      JobMemoryMiB above fit any of them the same way.
  RootVolumeSizeGiB:
    Type: Number
    Default: 350
    Description: >
      Root EBS size per instance. Needs room for the cached Dfam data
      (~35GB+), the decompressed genome, earlGrey/RepeatModeler scratch,
      and the SwapSizeMiB swap file below.
  SwapSizeMiB:
    Type: Number
    Default: 98304
    Description: >
      96GiB swap file created on each instance at boot (see
      BatchLaunchTemplate's UserData) and granted to the container via
      JobDefinition's LinuxParameters.MaxSwap (same value, in MiB — keep
      these in sync if you change this). earlGrey's memory use is driven by
      which repeat family a thread is refining, not a fixed per-thread
      constant (a single worker was observed at ~60GB RSS on its own during
      testing) — swap turns an overage into a slow-but-survives fallback
      instead of an instant OOM-kill that loses the whole multi-hour run.
      Low Swappiness (10) keeps the kernel preferring RAM and only spilling
      to swap under real pressure. Note this is a real tradeoff, not a free
      safety net: a genome that's genuinely too big will thrash on swap
      instead of failing fast, potentially running for hours before hitting
      JobDefinition's 12h Timeout rather than failing (and freeing the Spot
      instance) quickly.

Resources:
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: earlgrey-insects
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 10",
                "selection": {"tagStatus": "untagged", "countType": "imageCountMoreThan", "countNumber": 10},
                "action": {"type": "expire"}
              }
            ]
          }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/batch/earlgrey
      RetentionInDays: 30

  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: batch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole

  SpotFleetRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: spotfleet.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2SpotFleetTaggingRole

  EcsInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
      Policies:
        - PolicyName: earlgrey-instance-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LogGroup.Arn

  EcsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EcsInstanceRole

  # Task-level role for the earlGrey container itself (aws s3 cp/sync calls
  # in entrypoint.sh) — scoped to just the one data bucket, separate from
  # the EC2 instance/ECS-agent role above.
  JobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: earlgrey-data-bucket-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${DataBucketName}"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${DataBucketName}/*"

  BatchLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: earlgrey-batch-lt
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref RootVolumeSizeGiB
              VolumeType: gp3
              DeleteOnTermination: true
        # AWS Batch inserts its own ECS-agent bootstrap commands after the
        # shebang line of a shell-script UserData, so a plain script here
        # is safe to combine with Batch's own instance setup.
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            fallocate -l ${SwapSizeMiB}M /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=${SwapSizeMiB}
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo "vm.swappiness=10" >> /etc/sysctl.conf
            sysctl -p

  ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: SPOT
        AllocationStrategy: SPOT_CAPACITY_OPTIMIZED
        BidPercentage: 100
        SpotIamFleetRole: !GetAtt SpotFleetRole.Arn
        MinvCpus: 0
        MaxvCpus: !Ref MaxvCpus
        DesiredvCpus: 0
        InstanceTypes: !Ref InstanceTypes
        InstanceRole: !GetAtt EcsInstanceProfile.Arn
        LaunchTemplate:
          LaunchTemplateId: !Ref BatchLaunchTemplate
          Version: !GetAtt BatchLaunchTemplate.LatestVersionNumber
        Subnets: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroupId
        Tags:
          Name: earlgrey-batch-worker

  JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: earlgrey-queue
      Priority: 1
      State: ENABLED
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref ComputeEnvironment

  JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: earlgrey-job
      Type: container
      PlatformCapabilities:
        - EC2
      RetryStrategy:
        Attempts: 3
        EvaluateOnExit:
          # Spot-reclaim exits get retried; anything else (a real earlGrey
          # failure) exits immediately instead of burning retry attempts.
          - Action: RETRY
            OnStatusReason: "Host EC2*"
          - Action: EXIT
            OnReason: "*"
      Timeout:
        AttemptDurationSeconds: 43200
      ContainerProperties:
        Image: !Sub "${EcrRepository.RepositoryUri}:${ImageTag}"
        JobRoleArn: !GetAtt JobRole.Arn
        ResourceRequirements:
          - Type: VCPU
            Value: !Ref JobVcpus
          - Type: MEMORY
            Value: !Ref JobMemoryMiB
        LinuxParameters:
          # Without this, a container gets no swap even if the host has
          # some — Docker/ECS default MaxSwap to 0 unless told otherwise.
          # Low Swappiness biases the kernel to only spill to swap once
          # JobMemoryMiB is genuinely exhausted, not proactively.
          MaxSwap: !Ref SwapSizeMiB
          Swappiness: 10
        Volumes:
          - Name: dfam-cache
            Host:
              SourcePath: /mnt/dfam-cache
        MountPoints:
          - ContainerPath: /opt/conda/envs/earlgrey/share/famdb-3.0.0/Libraries/famdb
            SourceVolume: dfam-cache
            ReadOnly: false
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref LogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: earlgrey

Outputs:
  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
  JobQueueName:
    Value: !Ref JobQueue
  JobDefinitionName:
    Value: !Ref JobDefinition
  LogGroupName:
    Value: !Ref LogGroup
