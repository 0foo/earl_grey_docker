services:
  earlgrey:
    build:
      context: ..
      dockerfile: docker/earlgrey.Dockerfile
    image: earlgrey-insects:7.3.1
    volumes:
      - ${DFAM_DATA_DIR}:/opt/conda/envs/earlgrey/share/famdb-3.0.0/Libraries/famdb
      - ${GENOMES_DIR}:/genomes
      - ${OUTPUT_DIR}:/output
    stdin_open: true
    tty: true

  tools:
    build:
      context: ..
      dockerfile: docker/tools.Dockerfile
    image: bioinfo-tools:latest
    volumes:
      - ${GENOMES_DIR}:/genomes
      - ${OUTPUT_DIR}:/output
    stdin_open: true
    tty: true

# Build:
#   docker compose build
#
# DFAM_DATA_DIR, GENOMES_DIR, and OUTPUT_DIR must be set (no defaults) —
# either inline or via a .env file next to this compose file:
#   DFAM_DATA_DIR=/data/bioinfo/data/dfam_data \
#   GENOMES_DIR=/data/bioinfo/data/genomes \
#   OUTPUT_DIR=/data/bioinfo/data/output \
#     docker compose run --rm earlgrey -g <genome.fasta> -s <species> -o <output_dir> -t <threads>
#
# -g (path relative to /genomes inside the container, which maps to
# $GENOMES_DIR on the host) and -o (relative to /output, which maps to
# $OUTPUT_DIR) also accept s3:// URIs (for parity with AWS Batch) even when
# run locally via compose, as long as AWS credentials are available in the
# container (e.g. mount ~/.aws or export AWS_* env vars).
